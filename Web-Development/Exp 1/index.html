
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCP/IP Protocol Suite</title>
    <style>
        :root {
            --navy: #15253a;
            --blue: #2f80ed;
            --soft-blue: #eaf3ff;
            --text: #263445;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 32px 16px;
            color: var(--text);
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(135deg, #dfeaff 0%, #f7fbff 55%, #d9eef5 100%);
        }

        main {
            width: min(760px, 100%);
            padding: 36px;
            border: 1px solid rgba(47, 128, 237, 0.12);
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.92);
            box-shadow: 0 18px 45px rgba(32, 74, 120, 0.14);
        }

        h1 {
            margin: 0 0 10px;
            color: var(--navy);
            font-size: clamp(28px, 5vw, 42px);
            letter-spacing: -1px;
        }

        .details {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 18px 0 28px;
        }

        .details p {
            margin: 0;
            padding: 8px 12px;
            border-radius: 999px;
            background: var(--soft-blue);
            color: #3d5b7a;
            font-size: 14px;
        }

        h2 {
            margin: 0 0 16px;
            color: var(--blue);
            font-size: 20px;
        }

        .protocol {
            margin: 12px 0;
            padding: 16px 18px;
            border-left: 4px solid var(--blue);
            border-radius: 8px;
            background: #f7faff;
        }

        .protocol h3 {
            margin: 0 0 6px;
            color: var(--navy);
            font-size: 17px;
        }

        .protocol p {
            margin: 0;
            line-height: 1.6;
        }

        @media (max-width: 480px) {
            main {
                padding: 24px 18px;
            }

            .details {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <main>
        <h1>TCP/IP Protocol Suite</h1>

        <div class="details">
            <p>Name: Chamunda S</p>
            <p>Register Number: YOUR_REGISTER_NUMBER</p>
        </div>

        <h2>List of TCP/IP Protocols</h2>

        <section class="protocol">
            <h3>1. Application Layer</h3>
            <p>HTTP, HTTPS, FTP, SMTP, DNS, DHCP</p>
        </section>

        <section class="protocol">
            <h3>2. Transport Layer</h3>
            <p>TCP, UDP</p>
        </section>

        <section class="protocol">
            <h3>3. Internet Layer</h3>
            <p>IP, ICMP, IGMP</p>
        </section>

        <section class="protocol">
            <h3>4. Network Access Layer</h3>
            <p>Ethernet, Wi-Fi, ARP</p>
        </section>
    </main>
</body>
</html>
